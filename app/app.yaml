command:
  - "streamlit"
  - "run"
  - "app.py"
  - "--server.port"
  - "8000"
  - "--server.address"
  - "0.0.0.0"
  - "--server.headless"
  - "true"

env:
  - name: AGENT_ENDPOINT
    value: contraloria_audit_agent
  - name: DEFAULT_LLM
    value: databricks-claude-opus-4-7
  # Lista (coma) de endpoints LLM que ofrece el selector (el primero es el por defecto). Deben
  # EXISTIR en el workspace. Por defecto usamos endpoints Foundation Model del sistema (validados
  # con tool-calling). Si usas Unity Gateway, pon aqui los model services gobernados (UC de 3
  # niveles) y configura las credenciales del SP del gateway en el agente.
  - name: GOVERNED_LLMS
    value: "databricks-claude-opus-4-7,databricks-claude-opus-5-5"
  - name: CONTRALORIA_CATALOG
    value: dacamargovws_catalog
  - name: CONTRALORIA_SCHEMA
    value: contraloria
  - name: VOL_INFORMES
    value: informes
  - name: VOL_ANALITICOS
    value: informes-analiticos
  # ID exacto del job de informes, inyectado desde el recurso 'report_job' del bundle
  # (robusto y sin depender de coincidencia de nombre en el workspace).
  - name: REPORT_JOB_ID
    valueFrom: report_job
  # Fallback por nombre si 'REPORT_JOB_ID' no estuviera disponible.
  - name: REPORT_JOB_NAME_CONTAINS
    value: "generate_report"
  # ID del job de ingesta, inyectado desde el recurso 'ingest_job' del bundle. La app lo dispara
  # (run_now) al subir un PDF, en lugar de depender del trigger por llegada de archivo.
  - name: INGEST_JOB_ID
    valueFrom: ingest_job
