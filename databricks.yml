bundle:
  name: contraloria-audit-agent

# ============================================================================
# EDITAR ANTES DE DESPLEGAR (marcado con  <-- EDITAR):
#   - targets.dev.workspace.host  (URL de tu workspace)
#   - variables.catalog / schema  (donde viven los datos)
#   - variables.warehouse_id      (tu SQL warehouse serverless)
# El resto puede quedar por defecto. Los LLMs se AUTODETECTAN en el despliegue.
# ============================================================================

variables:
  catalog:
    description: Unity Catalog donde viven los datos de la Contraloria
    default: dacamargovws_catalog        # <-- EDITAR
  schema:
    description: Schema con los volumenes e insumos de auditoria
    default: contraloria                 # <-- EDITAR (opcional)
  volume_informes:
    description: Volumen con los PDFs de informes de auditoria (insumo)
    default: informes
  volume_analiticos:
    description: Volumen donde se guardan los informes analiticos generados
    default: informes-analiticos
  vs_endpoint:
    description: Nombre del endpoint de Vector Search
    default: contraloria_vs
  embedding_endpoint:
    description: Foundation model para embeddings
    default: databricks-gte-large-en
  llm_endpoint:
    description: Foundation model para el agente y la generacion de informes
    default: databricks-claude-opus-4-7
  warehouse_id:
    description: SQL Warehouse serverless
    default: 61200af9c31dec2e            # <-- EDITAR
  agent_endpoint:
    description: Nombre del endpoint de serving del agente
    default: contraloria_audit_agent

  # --- Mosaic AI Gateway (opt-in). Vacio => deshabilitado; el agente usa el FM de sistema. ---
  # Para activar la gobernanza (usage, rate limit, guardrails PII/safety, fallbacks) se crea un
  # endpoint External Model propio y se enruta el agente por el. Requisito: guardar la API key
  # del proveedor como secreto (ver src/setup_ai_gateway.py y el README).
  governed_llm_endpoint:
    description: Endpoint LLM gobernado por AI Gateway. Vacio = deshabilitado (usa FM de sistema).
    default: ""
  ext_provider:
    description: Proveedor External Model del endpoint gobernado (anthropic|openai|cohere)
    default: anthropic
  ext_model:
    description: Modelo del proveedor (p.ej. claude-opus-4-20250514, gpt-4o)
    default: claude-opus-4-20250514
  ext_secret_scope:
    description: Scope de secretos de Databricks con las API keys externas
    default: contraloria
  ext_secret_key:
    description: Clave del secreto con la API key del proveedor primario
    default: anthropic_api_key
  ext_fallback_provider:
    description: Proveedor de fallback (opcional; vacio = sin fallback)
    default: ""
  ext_fallback_model:
    description: Modelo de fallback (opcional)
    default: ""
  ext_fallback_secret_key:
    description: Clave del secreto con la API key del proveedor de fallback
    default: openai_api_key
  rate_limit_calls:
    description: Rate limit GLOBAL por endpoint, llamadas por minuto
    default: "120"
  pii_behavior:
    description: Comportamiento de guardrails ante PII (BLOCK | NONE)
    default: BLOCK

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-dacamargovws.cloud.databricks.com   # <-- EDITAR
    resources:
      # Los recursos (jobs, app) se cargan desde resources/*.yml

include:
  - resources/*.yml
