resources:
  jobs:

    # Mosaic AI Gateway (opt-in): CREA/actualiza UN endpoint LLM gobernado por corrida.
    # Es seguro ejecutarlo siempre: si create_llm_endpoint esta vacio o falta el secreto, el
    # notebook termina sin cambios. Repite por cada modelo que quieras gobernar.
    setup_ai_gateway:
      name: "[contraloria] setup_ai_gateway"
      tasks:
        - task_key: setup_ai_gateway
          notebook_task:
            notebook_path: ../src/setup_ai_gateway.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              create_llm_endpoint: ${var.create_llm_endpoint}
              ext_provider: ${var.ext_provider}
              ext_model: ${var.ext_model}
              ext_secret_scope: ${var.ext_secret_scope}
              ext_secret_key: ${var.ext_secret_key}
              ext_fallback_provider: ${var.ext_fallback_provider}
              ext_fallback_model: ${var.ext_fallback_model}
              ext_fallback_secret_key: ${var.ext_fallback_secret_key}
              rate_limit_calls: ${var.rate_limit_calls}
              pii_behavior: ${var.pii_behavior}
