resources:
  apps:
    contraloria_app:
      name: contraloria-audit-agent
      description: "Asistente de auditoria: chat con citas + generacion de informes analiticos"
      source_code_path: ../app
      resources:
        # NOTA: el endpoint del agente NO se declara aqui como recurso del bundle a proposito.
        # Ese endpoint lo crea el job 'deploy_agent' (paso 4), DESPUES de que el bundle crea la
        # app; declararlo aqui haria que la creacion de la app fallara con 404 en workspaces
        # nuevos (el endpoint aun no existe). En su lugar, deploy.sh otorga CAN_QUERY al SP de la
        # app sobre el endpoint una vez desplegado el agente (seccion de grants al final).
        - name: report_job
          description: Job que genera el informe analitico en PDF
          job:
            id: ${resources.jobs.generate_report.id}
            permission: CAN_MANAGE_RUN
        - name: warehouse
          description: SQL Warehouse serverless
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
